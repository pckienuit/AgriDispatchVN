# Azure DevOps pipeline for the IS402 cloud branch.
# Azure DevOps owns the trigger, Terraform validation gate, environment approval, and deploy gate.
# Jenkins owns lint, tests, image builds and ACR publish; the Build stage calls Jenkins REST through server/scripts/jenkins-build.js.
# Secrets live only in the variable group agridispatch-cloud-ci (or a Key Vault-linked group). None are written in this file.
# Full runbook: docs/pipelines.md

trigger:
  batch: true
  branches:
    include:
      - main

# Pull requests run the Validate stage only: no variable group, no self-hosted agent, no Jenkins call, no deploy.
pr:
  branches:
    include:
      - main

parameters:
  - name: publish
    displayName: Publish SHA-tagged images to ACR through Jenkins (manual opt-in)
    type: boolean
    default: false
  - name: cloudReady
    displayName: Allow the Deploy stage after a successful Build (false keeps Azure deploy off)
    type: boolean
    default: false

variables:
  JENKINS_JOB: agridispatch/cloud
  TERRAFORM_VERSION: '1.17.2'
  TERRAFORM_DIR: infra/terraform

stages:
  - stage: Validate
    displayName: Validate (branch and PR, no secrets)
    jobs:
      - job: UnitValidate
        displayName: Unit tests for the Jenkins client and pipeline structure
        timeoutInMinutes: 10
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
            clean: true
          - task: NodeTool@0
            displayName: Node 26
            inputs:
              versionSpec: '26.x'
          # Native YAML contract checks need Python + PyYAML, not a custom parser.
          - bash: |
              set -euo pipefail
              python3 -m venv "$AGENT_TEMPDIRECTORY/agri-yaml"
              "$AGENT_TEMPDIRECTORY/agri-yaml/bin/python3" -m pip install PyYAML==6.0.3
              export PATH="$AGENT_TEMPDIRECTORY/agri-yaml/bin:$PATH"
              node --test server/tests/jenkins-build.test.js
            displayName: Run jenkins-build unit and structure tests

  - stage: Terraform
    displayName: Terraform format, validate and mocked contract tests (no Azure calls)
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: TerraformValidate
        displayName: Validate infra/terraform with pinned Terraform 1.17.2
        timeoutInMinutes: 15
        # Mandatory self-hosted agent with preinstalled pinned Terraform 1.17.2 (no Marketplace TerraformInstaller extension).
        pool:
          name: agridispatch-jenkins-bridge
        steps:
          - checkout: self
            clean: true
          - task: NodeTool@0
            displayName: Node 26
            inputs:
              versionSpec: '26.x'
          - bash: |
              set -euo pipefail
              command -v terraform >/dev/null || { echo 'terraform 1.17.2 must be preinstalled on agent' >&2; exit 1; }
              actual_tf=$(terraform version -json | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(String(d.terraform_version || ""));')
              if [ "$actual_tf" != "$TERRAFORM_VERSION" ]; then
                echo "Expected Terraform $TERRAFORM_VERSION, got $actual_tf" >&2
                exit 1
              fi
              test -d "$TF_DIR" || { echo "$TF_DIR does not exist in commit $BUILD_SHA" >&2; exit 1; }
              terraform -chdir="$TF_DIR" fmt -check -recursive
              terraform -chdir="$TF_DIR" init -backend=false -input=false
              terraform -chdir="$TF_DIR" validate
              terraform -chdir="$TF_DIR" test -no-color
            displayName: Format check, validate and test infra/terraform
            env:
              TF_DIR: $(TERRAFORM_DIR)
              TERRAFORM_VERSION: $(TERRAFORM_VERSION)
              BUILD_SHA: $(Build.SourceVersion)
              TF_IN_AUTOMATION: '1'
              TF_INPUT: '0'

  - stage: Build
    displayName: Jenkins build and optional ACR publish
    dependsOn:
      - Validate
      - Terraform
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: agridispatch-cloud-ci
    jobs:
      - job: JenkinsBuild
        displayName: Trigger agridispatch/cloud and wait within bound
        timeoutInMinutes: 75
        # Jenkins is reached only over the approved VPN, so this job needs a self-hosted agent in that network.
        pool:
          name: agridispatch-jenkins-bridge
        steps:
          - checkout: self
            clean: true
          - task: NodeTool@0
            displayName: Node 26
            inputs:
              versionSpec: '26.x'
          - bash: |
              set -euo pipefail
              if [[ ! "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo 'Build.SourceVersion must be a full lowercase 40-character SHA' >&2
                exit 1
              fi
              publish=$(printf '%s' "$PUBLISH_RAW" | tr '[:upper:]' '[:lower:]')
              case "$publish" in
                true|false) ;;
                *) echo 'publish parameter must be true or false' >&2; exit 1 ;;
              esac
              export PUBLISH="$publish"
              mkdir -p "$BUILD_ARTIFACTS"
              node server/scripts/jenkins-build.js run > "$BUILD_ARTIFACTS/jenkins-result.json"
              cat "$BUILD_ARTIFACTS/jenkins-result.json"
            displayName: Trigger Jenkins job with BUILD_SHA and PUBLISH
            env:
              BUILD_SHA: $(Build.SourceVersion)
              PUBLISH_RAW: ${{ parameters.publish }}
              BUILD_ARTIFACTS: $(Build.ArtifactStagingDirectory)
              JENKINS_URL: $(JENKINS_URL)
              JENKINS_JOB: $(JENKINS_JOB)
              JENKINS_USER: $(JENKINS_USER)
              JENKINS_TOKEN: $(JENKINS_TOKEN)
              ACR_REGISTRY: $(ACR_REGISTRY)
          - publish: $(Build.ArtifactStagingDirectory)/jenkins-result.json
            artifact: jenkins-build-result
            displayName: Keep Jenkins result for the deploy gate

  - stage: Deploy
    displayName: Deploy to Azure (manual gate, off unless cloudReady)
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ${{ eq(parameters.cloudReady, true) }}, ${{ eq(parameters.publish, true) }}, ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: agridispatch-cloud-ci
    jobs:
      - deployment: DeployCloud
        displayName: Preflight, deploy and verify
        timeoutInMinutes: 90
        # The protected environment must have a manual approval check configured in Azure DevOps.
        environment: agridispatch-is402-cloud
        pool:
          name: agridispatch-jenkins-bridge
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                - task: NodeTool@0
                  displayName: Node 26
                  inputs:
                    versionSpec: '26.x'
                - download: current
                  artifact: jenkins-build-result
                - bash: |
                    set -euo pipefail
                    require() {
                      local value="${!1:-}"
                      if [ -z "$value" ] || [[ "$value" == *'$('* ]]; then
                        echo "$1 is required in pipeline configuration" >&2
                        exit 1
                      fi
                    }
                    require BUDGET_APPROVAL_ID
                    require QUOTA_CHECKED_AT
                    require TARGET_CONFIG_FILE
                    if [[ ! "$QUOTA_CHECKED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?Z$ ]]; then
                      echo 'QUOTA_CHECKED_AT must be an ISO 8601 UTC timestamp' >&2
                      exit 1
                    fi
                    node -e '
                      const ts = Date.parse(process.argv[1]);
                      const now = Date.now();
                      if (!Number.isFinite(ts) || ts > now + 300_000 || now - ts > 86_400_000) {
                        console.error("QUOTA_CHECKED_AT must be within the last 24 hours");
                        process.exit(1);
                      }
                    ' "$QUOTA_CHECKED_AT"
                    case "$TARGET_CONFIG_FILE" in
                      /*) ;;
                      *) echo 'TARGET_CONFIG_FILE must be an absolute external path outside the repository' >&2; exit 1 ;;
                    esac
                    sources_real=$(cd "$BUILD_SOURCES" && pwd -P)
                    target_real=$(realpath -m "$TARGET_CONFIG_FILE")
                    case "$target_real" in
                      "$sources_real"|"$sources_real"/*)
                        echo 'TARGET_CONFIG_FILE must point outside the repository checkout' >&2
                        exit 1
                        ;;
                    esac
                    test -f "$TARGET_CONFIG_FILE" || { echo 'TARGET_CONFIG_FILE does not exist' >&2; exit 1; }
                    for helper in preflight deploy verify; do
                      test -f "server/scripts/cloud/$helper.js" || { echo "server/scripts/cloud/$helper.js is missing; deploy blocked" >&2; exit 1; }
                    done
                    node -e '
                      const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                      const sha = process.argv[2];
                      const expected = { app: "agridispatch-vn", function: "agridispatch-thumbnail" };
                      if (r.status !== "SUCCESS" || r.sha !== sha || r.publish !== true || !Array.isArray(r.images) || r.images.length !== 2) process.exit(1);
                      const seen = new Set();
                      for (const img of r.images) {
                        if (!expected[img.name] || seen.has(img.name)) process.exit(1);
                        seen.add(img.name);
                        if (img.repository !== expected[img.name] || img.tag !== sha) process.exit(1);
                        if (!/^sha256:[0-9a-f]{64}$/.test(img.digest || "")) process.exit(1);
                        if (!new RegExp(`^[a-z0-9]{5,50}\\.azurecr\\.io/${expected[img.name]}@${img.digest}$`).test(img.ref || "")) process.exit(1);
                      }
                    ' "$RESULT_FILE" "$BUILD_SHA"
                    node server/scripts/cloud/preflight.js --result "$RESULT_FILE" --sha "$BUILD_SHA" --budget-approval "$BUDGET_APPROVAL_ID" --quota-checked-at "$QUOTA_CHECKED_AT" --target "$TARGET_CONFIG_FILE"
                    node server/scripts/cloud/deploy.js --result "$RESULT_FILE" --sha "$BUILD_SHA" --target "$TARGET_CONFIG_FILE" --budget-approval "$BUDGET_APPROVAL_ID" --quota-checked-at "$QUOTA_CHECKED_AT" --execute
                    node server/scripts/cloud/verify.js --result "$RESULT_FILE" --sha "$BUILD_SHA" --target "$TARGET_CONFIG_FILE" --budget-approval "$BUDGET_APPROVAL_ID" --quota-checked-at "$QUOTA_CHECKED_AT"
                  displayName: Preflight gate, deploy and verify
                  env:
                    BUILD_SHA: $(Build.SourceVersion)
                    BUILD_SOURCES: $(Build.SourcesDirectory)
                    RESULT_FILE: $(Pipeline.Workspace)/jenkins-build-result/jenkins-result.json
                    BUDGET_APPROVAL_ID: $(BUDGET_APPROVAL_ID)
                    QUOTA_CHECKED_AT: $(QUOTA_CHECKED_AT)
                    TARGET_CONFIG_FILE: $(TARGET_CONFIG_FILE)
