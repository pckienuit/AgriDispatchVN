name: agridispatch-vn
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agridispatch}
      POSTGRES_USER: ${POSTGRES_USER:-agridispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env for local development}
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-agridispatch}:${POSTGRES_PASSWORD:?Set local POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agridispatch}"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: agridispatch_test
      POSTGRES_USER: agridispatch
      POSTGRES_PASSWORD: disposable_test_only
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  test:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: test
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgresql://agridispatch:disposable_test_only@test-db:5432/agridispatch_test
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  pgdata:
